<!-- Dashboard Campañas -->
<div id="dashboard-campañas" class="dashboard-section">
    <h1 class="page-title">Campañas</h1>

    <div class="row g-4">
        <!-- Crear campaña -->
        <div class="col-lg-8">
            <div class="chart-card">
                <h3 class="section-title">Crear campaña</h3>
                <form>
                    <div class="mb-3">
                        <label class="form-label">Título</label>
                        <input type="text" class="form-control form-control-custom" placeholder="Título">
                    </div>
                    <div class="row g-3 mb-3">
                        <div class="col-md-6">
                            <label class="form-label">Desde</label>
                            <input type="date" class="form-control form-control-custom">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Hasta</label>
                            <input type="date" class="form-control form-control-custom">
                        </div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Descripción</label>
                        <input type="file" class="form-control form-control-custom">
                    </div>
                    <button type="submit" class="btn-yellow">Crear campaña</button>
                </form>
            </div>
        </div>

        <!-- Campaña actual -->
        <div class="col-lg-4">
            <div class="chart-card text-center">
                <h3 class="section-title">Campaña de vacunación</h3>
                <div class="mb-3">
                    <h4>Octubre</h4>
                    <!-- Calendario simplificado -->
                    <div class="bg-light p-3 rounded mb-3">
                        <small>Calendario de campaña</small>
                    </div>
                </div>
                <div class="mb-3">
                    <img src="data:image/svg+xml,%3Csvg width='100' height='80' xmlns='http://www.w3.org/2000/svg'%3E%3Crect width='100' height='80' fill='%23E8F5F0'/%3E%3Ctext x='50' y='40' text-anchor='middle' fill='%232DB584'%3E👩‍⚕️👶%3C/text%3E%3C/svg%3E"
                        alt="Campaña" class="img-fluid rounded">
                </div>
                <button class="btn-green w-100">Ver/editar</button>
            </div>
        </div>
    </div>
</div>
